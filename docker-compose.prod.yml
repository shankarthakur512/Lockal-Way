services:
  server:
    image: ${SERVER_IMAGE:-lokalway-server:local}
    build:
      context: ./server
    env_file:
      - ${SERVER_ENV_FILE:-./server/.env.example}
    environment:
      NODE_ENV: production
      PORT: 8000
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/healthz').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  client:
    image: ${CLIENT_IMAGE:-lokalway-client:local}
    build:
      context: ./client
    env_file:
      - ${CLIENT_ENV_FILE:-./client/.env.example}
    ports:
      - "${LOKALWAY_HTTP_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
